<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitectura de Autosale</title>
  <desc id="desc">Diagrama del tótem Windows con periféricos serie, aplicación WinForms, SQL Server local, sincronización Quartz y SQL Server remoto.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06141b"/>
      <stop offset="1" stop-color="#0a1c25"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7C99"/>
    </marker>
    <marker id="flechaVerde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9D8F"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="18" fill="url(#fondo)"/>
  <rect x="24" y="24" width="1152" height="672" rx="14" fill="none" stroke="#1b3540" stroke-width="1"/>

  <text x="64" y="78" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Autosale · arquitectura del tótem</text>
  <text x="64" y="108" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Aplicación WinForms sobre Windows, periféricos serie/USB y sincronización con SQL Server</text>

  <!-- Periféricos izquierda -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="164" fill="#5B7C99" font-size="12" font-weight="700" letter-spacing="2">PERIFÉRICOS</text>

    <g filter="url(#sombra)">
      <rect x="64" y="184" width="260" height="82" rx="10" fill="#0d2029" stroke="#457B9D" stroke-width="1.4"/>
    </g>
    <text x="84" y="214" fill="#e6eef0" font-size="17" font-weight="700">Pin pad Transbank</text>
    <text x="84" y="238" fill="#a9c0c8" font-size="13">COM6 · 115200 8N1 · ACK</text>
    <text x="84" y="256" fill="#8fb0bd" font-size="12">Venta, anulación, cierre</text>

    <g filter="url(#sombra)">
      <rect x="64" y="284" width="260" height="82" rx="10" fill="#0d2029" stroke="#457B9D" stroke-width="1.4"/>
    </g>
    <text x="84" y="314" fill="#e6eef0" font-size="17" font-weight="700">Lector RFID</text>
    <text x="84" y="338" fill="#a9c0c8" font-size="13">COM7 · 9600 8N1</text>
    <text x="84" y="356" fill="#8fb0bd" font-size="12">Código de cliente (10 chars)</text>

    <g filter="url(#sombra)">
      <rect x="64" y="384" width="260" height="82" rx="10" fill="#0d2029" stroke="#457B9D" stroke-width="1.4"/>
    </g>
    <text x="84" y="414" fill="#e6eef0" font-size="17" font-weight="700">Impresora Epson</text>
    <text x="84" y="438" fill="#a9c0c8" font-size="13">COM EpsonFPHostControlX</text>
    <text x="84" y="456" fill="#8fb0bd" font-size="12">Voucher y comprobantes</text>

    <g filter="url(#sombra)">
      <rect x="64" y="484" width="260" height="82" rx="10" fill="#0d2029" stroke="#457B9D" stroke-width="1.4"/>
    </g>
    <text x="84" y="514" fill="#e6eef0" font-size="17" font-weight="700">Cashdro</text>
    <text x="84" y="538" fill="#a9c0c8" font-size="13">HTTPS · /Cashdro3WS</text>
    <text x="84" y="556" fill="#8fb0bd" font-size="12">Dispensador de efectivo</text>
  </g>

  <!-- Flechas periféricos -> tótem -->
  <g stroke="#5B7C99" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <path d="M 324 225 C 370 225 380 280 404 300"/>
    <path d="M 324 325 C 370 325 380 330 404 338"/>
    <path d="M 324 425 C 370 425 380 390 404 376"/>
    <path d="M 324 525 C 370 525 380 440 404 414"/>
  </g>

  <!-- Tótem central -->
  <g filter="url(#sombra)">
    <rect x="404" y="180" width="380" height="440" rx="14" fill="#0d2029" stroke="#2A9D8F" stroke-width="2"/>
  </g>
  <rect x="404" y="180" width="380" height="46" rx="14" fill="#12303a"/>
  <text x="594" y="210" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700">Tótem Windows</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="428" y="250" width="332" height="120" rx="9" fill="#0a1c25" stroke="#1b3540"/>
    <text x="446" y="278" fill="#2A9D8F" font-size="12" font-weight="700" letter-spacing="1.5">APLICACIÓN</text>
    <text x="446" y="304" fill="#e6eef0" font-size="16" font-weight="600">AutoSell.exe · WinForms</text>
    <text x="446" y="328" fill="#a9c0c8" font-size="13">Autenticación · IngresoTarjeta</text>
    <text x="446" y="348" fill="#a9c0c8" font-size="13">Confirmación · TransBankGestion</text>
    <text x="446" y="368" fill="#8fb0bd" font-size="12">Program.cs → Principal</text>

    <rect x="428" y="386" width="332" height="96" rx="9" fill="#0a1c25" stroke="#1b3540"/>
    <text x="446" y="414" fill="#457B9D" font-size="12" font-weight="700" letter-spacing="1.5">INFRAESTRUCTURA</text>
    <text x="446" y="440" fill="#e6eef0" font-size="15" font-weight="600">librerias.cs · Herramientas</text>
    <text x="446" y="462" fill="#a9c0c8" font-size="13">TransBank · SincronizaVentas</text>
    <text x="446" y="480" fill="#a9c0c8" font-size="13">funciones · ResgistroError</text>

    <rect x="428" y="498" width="332" height="96" rx="9" fill="#0a1c25" stroke="#1b3540"/>
    <text x="446" y="526" fill="#5B7C99" font-size="12" font-weight="700" letter-spacing="1.5">DATOS LOCALES</text>
    <text x="446" y="552" fill="#e6eef0" font-size="15" font-weight="600">SQL Server Express</text>
    <text x="446" y="574" fill="#a9c0c8" font-size="13">.\SQLEXPRESS · DB</text>
    <text x="446" y="592" fill="#8fb0bd" font-size="12">Ventas · clientes · productos</text>
  </g>

  <!-- Flecha tótem -> servidor remoto -->
  <path d="M 784 330 C 840 330 840 280 884 280" stroke="#2A9D8F" stroke-width="2.5" fill="none" marker-end="url(#flechaVerde)"/>
  <text x="806" y="306" fill="#2A9D8F" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">sync</text>

  <!-- Servidor remoto -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="900" y="164" fill="#2A9D8F" font-size="12" font-weight="700" letter-spacing="2">SERVIDOR CENTRAL</text>

    <g filter="url(#sombra)">
      <rect x="884" y="196" width="252" height="148" rx="12" fill="#0d2029" stroke="#2A9D8F" stroke-width="1.6"/>
    </g>
    <text x="904" y="228" fill="#e6eef0" font-size="18" font-weight="700">SQL Server remoto</text>
    <text x="904" y="254" fill="#a9c0c8" font-size="13">Productos · Clientes</text>
    <text x="904" y="276" fill="#a9c0c8" font-size="13">Ventas · Auditoría</text>
    <text x="904" y="302" fill="#8fb0bd" font-size="12">Copia por tablas</text>
    <text x="904" y="322" fill="#8fb0bd" font-size="12">SqlBulkCopy + KeepIdentity</text>

    <g filter="url(#sombra)">
      <rect x="884" y="384" width="252" height="126" rx="12" fill="#0d2029" stroke="#457B9D" stroke-width="1.5"/>
    </g>
    <text x="904" y="416" fill="#e6eef0" font-size="17" font-weight="700">Quartz.NET</text>
    <text x="904" y="442" fill="#a9c0c8" font-size="13">JobDeSincronizacion</text>
    <text x="904" y="464" fill="#a9c0c8" font-size="13">JobDeCierreZ</text>
    <text x="904" y="488" fill="#8fb0bd" font-size="12">Cron leído desde la base</text>

    <g filter="url(#sombra)">
      <rect x="884" y="548" width="252" height="88" rx="12" fill="#0d2029" stroke="#1b3540" stroke-width="1.2"/>
    </g>
    <text x="904" y="578" fill="#e6eef0" font-size="15" font-weight="700">Stored procedures</text>
    <text x="904" y="600" fill="#a9c0c8" font-size="12">GetParametros · Insertatrx</text>
    <text x="904" y="620" fill="#a9c0c8" font-size="12">InsertLog</text>
  </g>

  <!-- Flecha Quartz -> SQL remoto -->
  <path d="M 1010 384 L 1010 346" stroke="#457B9D" stroke-width="1.8" fill="none" marker-end="url(#flecha)"/>

  <!-- Leyenda -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="64" y1="650" x2="106" y2="650" stroke="#5B7C99" stroke-width="2"/>
    <text x="116" y="655" fill="#a9c0c8" font-size="12">Serie / USB</text>
    <line x1="230" y1="650" x2="272" y2="650" stroke="#2A9D8F" stroke-width="2"/>
    <text x="282" y="655" fill="#a9c0c8" font-size="12">Sincronización</text>
    <line x1="420" y1="650" x2="462" y2="650" stroke="#457B9D" stroke-width="2"/>
    <text x="472" y="655" fill="#a9c0c8" font-size="12">Tareas programadas</text>
    <text x="1090" y="655" text-anchor="end" fill="#5B7C99" font-size="12">Puertos configurables · no hardcodear en producción</text>
  </g>
</svg>
