<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Arquitectura de turnero</title>
  <desc id="desc">Diagrama de los navegadores de display, kiosco y ejecutivo conectados por HTTP y SSE a una aplicación Flask con blueprints, servicios y SQLite.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06141b"/>
      <stop offset="1" stop-color="#0a1c25"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7C99"/>
    </marker>
    <marker id="flechaVerde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9D8F"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="18" fill="url(#fondo)"/>
  <rect x="24" y="24" width="1152" height="672" rx="14" fill="none" stroke="#1b3540" stroke-width="1"/>

  <text x="64" y="78" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">turnero · arquitectura web</text>
  <text x="64" y="108" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Tres interfaces, una API y un bus SSE en memoria</text>

  <!-- Clientes -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="164" fill="#5B7C99" font-size="12" font-weight="700" letter-spacing="2">NAVEGADORES</text>

    <g filter="url(#sombra)">
      <rect x="64" y="184" width="286" height="112" rx="11" fill="#0d2029" stroke="#2A9D8F" stroke-width="1.5"/>
    </g>
    <text x="86" y="216" fill="#e6eef0" font-size="18" font-weight="700">Display</text>
    <text x="86" y="240" fill="#a9c0c8" font-size="13">GET /</text>
    <text x="86" y="262" fill="#8fb0bd" font-size="12">EventSource · reconexión 3 s</text>
    <text x="86" y="280" fill="#8fb0bd" font-size="12">Pantalla pública</text>

    <g filter="url(#sombra)">
      <rect x="64" y="316" width="286" height="112" rx="11" fill="#0d2029" stroke="#457B9D" stroke-width="1.5"/>
    </g>
    <text x="86" y="348" fill="#e6eef0" font-size="18" font-weight="700">Kiosco</text>
    <text x="86" y="372" fill="#a9c0c8" font-size="13">GET /kiosco</text>
    <text x="86" y="394" fill="#8fb0bd" font-size="12">Trámite · RUT · QR</text>
    <text x="86" y="412" fill="#8fb0bd" font-size="12">POST /api/turnos/solicitar</text>

    <g filter="url(#sombra)">
      <rect x="64" y="448" width="286" height="112" rx="11" fill="#0d2029" stroke="#5B7C99" stroke-width="1.5"/>
    </g>
    <text x="86" y="480" fill="#e6eef0" font-size="18" font-weight="700">Ejecutivo</text>
    <text x="86" y="504" fill="#a9c0c8" font-size="13">GET /login · /ejecutivo</text>
    <text x="86" y="526" fill="#8fb0bd" font-size="12">Sesión + bcrypt + CSRF</text>
    <text x="86" y="544" fill="#8fb0bd" font-size="12">Llamar · iniciar · finalizar</text>
  </g>

  <!-- Flechas hacia Flask -->
  <g stroke="#5B7C99" stroke-width="2" fill="none" marker-end="url(#flecha)">
    <path d="M 350 226 C 390 226 396 250 420 260"/>
    <path d="M 350 372 C 390 372 396 356 420 348"/>
    <path d="M 350 504 C 390 504 396 440 420 424"/>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" fill="#8fb0bd" font-size="11">
    <text x="360" y="214">HTTP/SSE</text>
    <text x="360" y="392">HTTP/JSON</text>
    <text x="360" y="524">HTTP/JSON</text>
  </g>

  <!-- Flask -->
  <g filter="url(#sombra)">
    <rect x="420" y="174" width="400" height="430" rx="14" fill="#0d2029" stroke="#2A9D8F" stroke-width="2"/>
  </g>
  <rect x="420" y="174" width="400" height="46" rx="14" fill="#12303a"/>
  <text x="620" y="204" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Flask · create_app()</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="444" y="244" width="352" height="92" rx="8" fill="#0a1c25" stroke="#1b3540"/>
    <text x="462" y="270" fill="#457B9D" font-size="11" font-weight="700" letter-spacing="1.5">BLUEPRINTS</text>
    <text x="462" y="294" fill="#e6eef0" font-size="14">display · kiosco · executive · api</text>
    <text x="462" y="318" fill="#a9c0c8" font-size="12">Páginas HTML + endpoints JSON/SSE</text>

    <rect x="444" y="352" width="352" height="112" rx="8" fill="#0a1c25" stroke="#1b3540"/>
    <text x="462" y="378" fill="#2A9D8F" font-size="11" font-weight="700" letter-spacing="1.5">SERVICIOS</text>
    <text x="462" y="402" fill="#e6eef0" font-size="14">turno_service · auth_service</text>
    <text x="462" y="426" fill="#a9c0c8" font-size="12">validar_rut · solicitar_turno</text>
    <text x="462" y="446" fill="#a9c0c8" font-size="12">llamar_siguiente · iniciar/finalizar</text>

    <rect x="444" y="480" width="352" height="100" rx="8" fill="#0a1c25" stroke="#1b3540"/>
    <text x="462" y="506" fill="#5B7C99" font-size="11" font-weight="700" letter-spacing="1.5">TIEMPO REAL</text>
    <text x="462" y="530" fill="#e6eef0" font-size="14">SSE event bus (en memoria)</text>
    <text x="462" y="552" fill="#a9c0c8" font-size="12">Queue(100) por cliente · heartbeat 30 s</text>
    <text x="462" y="570" fill="#8fb0bd" font-size="11">un solo worker</text>
  </g>

  <!-- Flecha a SQLite -->
  <path d="M 620 604 L 620 636" stroke="#2A9D8F" stroke-width="2.2" fill="none" marker-end="url(#flechaVerde)"/>

  <!-- SQLite -->
  <g filter="url(#sombra)">
    <rect x="450" y="636" width="340" height="66" rx="10" fill="#0d2029" stroke="#2A9D8F" stroke-width="1.5"/>
  </g>
  <text x="620" y="662" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">SQLite · instance/turnero.db</text>
  <text x="620" y="684" text-anchor="middle" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">modulo · ejecutivo · tipo_tramite · turno</text>

  <!-- Panel derecho: flujo -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="860" y="164" fill="#5B7C99" font-size="12" font-weight="700" letter-spacing="2">FLUJO</text>

    <g filter="url(#sombra)">
      <rect x="860" y="184" width="276" height="392" rx="12" fill="#0d2029" stroke="#1b3540" stroke-width="1.2"/>
    </g>

    <circle cx="892" cy="222" r="12" fill="#2A9D8F"/>
    <text x="892" y="227" text-anchor="middle" fill="#06141b" font-size="12" font-weight="700">1</text>
    <text x="916" y="227" fill="#e6eef0" font-size="14" font-weight="600">Solicitar turno</text>
    <text x="916" y="247" fill="#8fb0bd" font-size="12">Kiosco valida RUT y crea QR</text>

    <circle cx="892" cy="292" r="12" fill="#457B9D"/>
    <text x="892" y="297" text-anchor="middle" fill="#06141b" font-size="12" font-weight="700">2</text>
    <text x="916" y="297" fill="#e6eef0" font-size="14" font-weight="600">Llamar siguiente</text>
    <text x="916" y="317" fill="#8fb0bd" font-size="12">FIFO · emite turno_llamado</text>

    <circle cx="892" cy="362" r="12" fill="#5B7C99"/>
    <text x="892" y="367" text-anchor="middle" fill="#06141b" font-size="12" font-weight="700">3</text>
    <text x="916" y="367" fill="#e6eef0" font-size="14" font-weight="600">Iniciar atención</text>
    <text x="916" y="387" fill="#8fb0bd" font-size="12">Escanea QR · valida token</text>

    <circle cx="892" cy="432" r="12" fill="#2A9D8F"/>
    <text x="892" y="437" text-anchor="middle" fill="#06141b" font-size="12" font-weight="700">4</text>
    <text x="916" y="437" fill="#e6eef0" font-size="14" font-weight="600">Finalizar</text>
    <text x="916" y="457" fill="#8fb0bd" font-size="12">Cierra y llama al siguiente</text>

    <line x1="892" y1="506" x2="892" y2="526" stroke="#1b3540" stroke-width="1"/>
    <text x="876" y="548" fill="#a9c0c8" font-size="12">Estados:</text>
    <text x="876" y="568" fill="#2A9D8F" font-size="12">esperando → llamado</text>
    <text x="876" y="586" fill="#2A9D8F" font-size="12">→ en_atencion → completado</text>
  </g>

  <text x="1090" y="700" text-anchor="end" fill="#5B7C99" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">SSE en memoria: un proceso, un bus</text>
</svg>
