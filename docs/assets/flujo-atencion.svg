<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Flujo de estados del turno</title>
  <desc id="desc">Máquina de estados: esperando, llamado, en atención y completado, con las acciones que producen cada transición.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06141b"/>
      <stop offset="1" stop-color="#0a1c25"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7C99"/>
    </marker>
  </defs>

  <rect width="1200" height="600" rx="18" fill="url(#fondo)"/>
  <rect x="24" y="24" width="1152" height="552" rx="14" fill="none" stroke="#1b3540" stroke-width="1"/>

  <text x="64" y="78" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700">Flujo de atención del turno</text>
  <text x="64" y="108" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Cada transición la ejecuta un servicio; la interfaz solo refleja el estado</text>

  <!-- Estado inicial -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <circle cx="64" cy="296" r="9" fill="#2A9D8F"/>
    <path d="M 64 296 L 88 296" stroke="#2A9D8F" stroke-width="2" marker-end="url(#flecha)"/>
    <text x="44" y="330" fill="#8fb0bd" font-size="11">inicio</text>
  </g>

  <!-- Estado 1 -->
  <g filter="url(#sombra)">
    <rect x="96" y="236" width="214" height="120" rx="12" fill="#0d2029" stroke="#5B7C99" stroke-width="2"/>
  </g>
  <rect x="96" y="236" width="214" height="6" rx="3" fill="#5B7C99"/>
  <text x="203" y="278" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">esperando</text>
  <text x="203" y="304" text-anchor="middle" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Turno creado por el kiosco</text>
  <text x="203" y="326" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">fecha_creacion</text>

  <!-- Transición 1 -->
  <path d="M 310 296 L 346 296" stroke="#5B7C99" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="328" y="188" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">llamar_siguiente()</text>
  <text x="328" y="208" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">FIFO · asigna módulo</text>

  <!-- Estado 2 -->
  <g filter="url(#sombra)">
    <rect x="352" y="236" width="214" height="120" rx="12" fill="#0d2029" stroke="#2A9D8F" stroke-width="2"/>
  </g>
  <rect x="352" y="236" width="214" height="6" rx="3" fill="#2A9D8F"/>
  <text x="459" y="278" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">llamado</text>
  <text x="459" y="304" text-anchor="middle" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">El display lo muestra</text>
  <text x="459" y="326" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">fecha_llamado</text>

  <!-- Transición 2 -->
  <path d="M 566 296 L 602 296" stroke="#2A9D8F" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="584" y="180" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">iniciar_atencion()</text>
  <text x="584" y="200" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">escanea qr_token</text>
  <text x="584" y="220" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">valida ejecutivo</text>

  <!-- Estado 3 -->
  <g filter="url(#sombra)">
    <rect x="608" y="236" width="214" height="120" rx="12" fill="#0d2029" stroke="#457B9D" stroke-width="2"/>
  </g>
  <rect x="608" y="236" width="214" height="6" rx="3" fill="#457B9D"/>
  <text x="715" y="278" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">en_atencion</text>
  <text x="715" y="304" text-anchor="middle" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">El ejecutivo atiende</text>
  <text x="715" y="326" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">fecha_inicio_atencion</text>

  <!-- Transición 3 -->
  <path d="M 822 296 L 858 296" stroke="#457B9D" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="840" y="180" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">finalizar_atencion()</text>
  <text x="840" y="200" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">tipo + comentarios</text>
  <text x="840" y="220" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">llama al siguiente</text>

  <!-- Estado 4 -->
  <g filter="url(#sombra)">
    <rect x="864" y="236" width="214" height="120" rx="12" fill="#0d2029" stroke="#2A9D8F" stroke-width="2"/>
  </g>
  <rect x="864" y="236" width="214" height="6" rx="3" fill="#2A9D8F"/>
  <text x="971" y="278" text-anchor="middle" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">completado</text>
  <text x="971" y="304" text-anchor="middle" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Cierre registrado</text>
  <text x="971" y="326" text-anchor="middle" fill="#8fb0bd" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">fecha_completado</text>

  <!-- Notas inferiores -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="96" y="418" width="470" height="88" rx="10" fill="#0a1c25" stroke="#1b3540"/>
    <text x="116" y="446" fill="#2A9D8F" font-size="12" font-weight="700" letter-spacing="1">INVARIANTES</text>
    <text x="116" y="470" fill="#c7d8de" font-size="13">El estado no se edita desde la UI: solo avanzan los servicios.</text>
    <text x="116" y="490" fill="#c7d8de" font-size="13">Un ejecutivo no puede acumular dos turnos activos.</text>

    <rect x="600" y="418" width="478" height="88" rx="10" fill="#0a1c25" stroke="#1b3540"/>
    <text x="620" y="446" fill="#457B9D" font-size="12" font-weight="700" letter-spacing="1">CAPACIDADES</text>
    <text x="620" y="470" fill="#c7d8de" font-size="13">El QR contiene qr_token, no el código visible del turno.</text>
    <text x="620" y="490" fill="#c7d8de" font-size="13">Iniciar exige sesión del ejecutivo asignado.</text>
  </g>

  <text x="64" y="556" fill="#5B7C99" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Un turno completado no vuelve a esperando: el siguiente ingresa como un turno nuevo.</text>
</svg>
