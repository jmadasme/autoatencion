<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Evolución de la autoatención en tres generaciones</title>
  <desc id="desc">Línea de tiempo con Autosale como primera generación, turnero como segunda y notificador como tercera, con sus stacks tecnológicos.</desc>

  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06141b"/>
      <stop offset="1" stop-color="#0a1c25"/>
    </linearGradient>
    <linearGradient id="linea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B7C99"/>
      <stop offset="0.5" stop-color="#2A9D8F"/>
      <stop offset="1" stop-color="#457B9D"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="18" fill="url(#fondo)"/>
  <rect x="24" y="24" width="1152" height="592" rx="14" fill="none" stroke="#1b3540" stroke-width="1"/>

  <text x="64" y="82" fill="#e6eef0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Evolución de la autoatención</text>
  <text x="64" y="114" fill="#a9c0c8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17">De un tótem de venta con hardware propietario a servicios web ligeros y desacoplados</text>

  <line x1="110" y1="230" x2="1090" y2="230" stroke="#1b3540" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="230" x2="1090" y2="230" stroke="url(#linea)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Nodo 1 -->
    <circle cx="230" cy="230" r="17" fill="#06141b" stroke="#5B7C99" stroke-width="4"/>
    <circle cx="230" cy="230" r="6" fill="#5B7C99"/>
    <text x="230" y="188" text-anchor="middle" fill="#5B7C99" font-size="13" font-weight="700" letter-spacing="2">GENERACIÓN 1</text>

    <g filter="url(#sombra)">
      <rect x="80" y="290" width="300" height="250" rx="12" fill="#0d2029" stroke="#5B7C99" stroke-width="1.5"/>
    </g>
    <rect x="80" y="290" width="6" height="250" rx="3" fill="#5B7C99"/>
    <text x="108" y="330" fill="#e6eef0" font-size="24" font-weight="700">Autosale</text>
    <text x="108" y="357" fill="#8fb0bd" font-size="14">Tótem de venta presencial</text>
    <line x1="108" y1="375" x2="352" y2="375" stroke="#1b3540" stroke-width="1"/>
    <text x="108" y="404" fill="#c7d8de" font-size="14">C# · WinForms · .NET 4.5.2</text>
    <text x="108" y="430" fill="#c7d8de" font-size="14">SQL Server local + remoto</text>
    <text x="108" y="456" fill="#c7d8de" font-size="14">Transbank serial · RFID</text>
    <text x="108" y="482" fill="#c7d8de" font-size="14">Epson · Cashdro · Quartz</text>
    <text x="108" y="514" fill="#8fb0bd" font-size="13" font-style="italic">Pesado, acoplado al hardware</text>

    <!-- Nodo 2 -->
    <circle cx="600" cy="230" r="17" fill="#06141b" stroke="#2A9D8F" stroke-width="4"/>
    <circle cx="600" cy="230" r="6" fill="#2A9D8F"/>
    <text x="600" y="188" text-anchor="middle" fill="#2A9D8F" font-size="13" font-weight="700" letter-spacing="2">GENERACIÓN 2</text>

    <g filter="url(#sombra)">
      <rect x="450" y="290" width="300" height="250" rx="12" fill="#0d2029" stroke="#2A9D8F" stroke-width="1.5"/>
    </g>
    <rect x="450" y="290" width="6" height="250" rx="3" fill="#2A9D8F"/>
    <text x="478" y="330" fill="#e6eef0" font-size="24" font-weight="700">turnero</text>
    <text x="478" y="357" fill="#8fb0bd" font-size="14">Fila digital y llamados</text>
    <line x1="478" y1="375" x2="722" y2="375" stroke="#1b3540" stroke-width="1"/>
    <text x="478" y="404" fill="#c7d8de" font-size="14">Python · Flask 3.1 · SSE</text>
    <text x="478" y="430" fill="#c7d8de" font-size="14">SQLite · SQLAlchemy</text>
    <text x="478" y="456" fill="#c7d8de" font-size="14">Kiosco · Ejecutivo · Display</text>
    <text x="478" y="482" fill="#c7d8de" font-size="14">RUT módulo 11 · QR</text>
    <text x="478" y="514" fill="#8fb0bd" font-size="13" font-style="italic">Web, un proceso, tiempo real</text>

    <!-- Nodo 3 -->
    <circle cx="970" cy="230" r="17" fill="#06141b" stroke="#457B9D" stroke-width="4"/>
    <circle cx="970" cy="230" r="6" fill="#457B9D"/>
    <text x="970" y="188" text-anchor="middle" fill="#457B9D" font-size="13" font-weight="700" letter-spacing="2">GENERACIÓN 3</text>

    <g filter="url(#sombra)">
      <rect x="820" y="290" width="300" height="250" rx="12" fill="#0d2029" stroke="#457B9D" stroke-width="1.5"/>
    </g>
    <rect x="820" y="290" width="6" height="250" rx="3" fill="#457B9D"/>
    <text x="848" y="330" fill="#e6eef0" font-size="24" font-weight="700">notificador</text>
    <text x="848" y="357" fill="#8fb0bd" font-size="14">Aviso por correo</text>
    <line x1="848" y1="375" x2="1092" y2="375" stroke="#1b3540" stroke-width="1"/>
    <text x="848" y="404" fill="#c7d8de" font-size="14">Python stdlib · argparse</text>
    <text x="848" y="430" fill="#c7d8de" font-size="14">SQLite (solo lectura)</text>
    <text x="848" y="456" fill="#c7d8de" font-size="14">SMTP · EmailMessage</text>
    <text x="848" y="482" fill="#c7d8de" font-size="14">Dry-run · logging dual</text>
    <text x="848" y="514" fill="#8fb0bd" font-size="13" font-style="italic">Acotado, sin UI, una tarea</text>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="590" fill="#5B7C99" font-size="13">Complejidad de despliegue</text>
    <line x1="300" y1="585" x2="430" y2="585" stroke="#5B7C99" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="64" y="610" fill="#2A9D8F" font-size="13">Portabilidad y facilidad de prueba</text>
    <line x1="300" y1="605" x2="430" y2="605" stroke="#2A9D8F" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="1090" y="600" text-anchor="end" fill="#a9c0c8" font-size="12">autoatención · tres generaciones</text>
  </g>
</svg>
